<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=land.html#living">
  <link rel="canonical" href="land.html#living">
  <title>Redirecting — Less Traveled</title>
  <script>
    (function () {
      var dest = "land.html#living";
      var hash = location.hash;
      if (dest.indexOf("#") >= 0) {
        location.replace(dest);
        return;
      }
      location.replace(dest + (hash || ""));
    })();
  </script>
</head>
<body>
  <p><a href="land.html#living">Continue</a></p>
</body>
</html>
